# Déploiement du calendrier sur Cloudflare Workers, depuis GitHub.
#
# Pourquoi ici plutôt que par le tableau de bord Cloudflare : le parcours
# « Connect GitHub » de Cloudflare se perd sur téléphone et renvoie à
# l'accueil du compte. GitHub, lui, tient la route dans un navigateur mobile.
#
# Ce qu'il faut poser une seule fois, dans Settings > Secrets and variables >
# Actions du dépôt :
#
#   CLOUDFLARE_API_TOKEN   — jeton « Edit Cloudflare Workers » (obligatoire)
#   CALENDAR_COACH_KEY     — la clé qui ouvre le mode coach (obligatoire)
#   CLOUDFLARE_ACCOUNT_ID  — seulement si le jeton voit plusieurs comptes
#
# Tant que les deux premiers manquent, la construction s'arrête proprement en
# le disant, plutôt que d'échouer sur un message d'authentification obscur.

name: Déployer le calendrier

on:
  push:
    branches: [main]
    paths:
      - 'calendrier/**'
      - '.github/workflows/deployer-calendrier.yml'
  workflow_dispatch:

# Un déploiement à la fois : deux poussées rapprochées ne doivent pas se
# doubler et laisser en ligne la plus ancienne des deux.
concurrency:
  group: deploiement-calendrier
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendrier

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Le calendrier n'a aucune dépendance npm : les tests tournent tels quels.
      # Ils passent avant le déploiement — on ne met pas en ligne du rouge.
      - name: Tests
        run: node --test

      - name: Vérifier que les secrets sont posés
        id: secrets
        env:
          JETON: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLE: ${{ secrets.CALENDAR_COACH_KEY }}
        run: |
          manquants=""
          [ -n "$JETON" ] || manquants="$manquants CLOUDFLARE_API_TOKEN"
          [ -n "$CLE" ] || manquants="$manquants CALENDAR_COACH_KEY"
          if [ -n "$manquants" ]; then
            echo "pret=non" >> "$GITHUB_OUTPUT"
            {
              echo "## Déploiement non effectué"
              echo
              echo "Secrets manquants :$manquants"
              echo
              echo "À poser dans **Settings → Secrets and variables → Actions**,"
              echo "puis relancer ce workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Secrets manquants :$manquants — déploiement sauté."
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Déployer le Worker
        if: steps.secrets.outputs.pret == 'oui'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      # Après le déploiement, et pas avant : « secret put » a besoin que le
      # Worker existe. Sans cette clé, le Worker répond 503 et personne ne
      # peut passer en mode coach.
      - name: Poser la clé coach
        if: steps.secrets.outputs.pret == 'oui'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CALENDAR_COACH_KEY: ${{ secrets.CALENDAR_COACH_KEY }}
        run: printf '%s' "$CALENDAR_COACH_KEY" | npx --yes wrangler@4 secret put CALENDAR_COACH_KEY

      - name: Où est-ce en ligne
        if: steps.secrets.outputs.pret == 'oui'
        run: |
          {
            echo "## Calendrier déployé"
            echo
            echo "<https://calendrier-entrainements.benbezi-sprinter.workers.dev>"
            echo
            echo "Vérification : \`/api/health\` doit indiquer \`\"type\": \"d1\"\`."
          } >> "$GITHUB_STEP_SUMMARY"
