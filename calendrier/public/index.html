<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Calendrier — 7 jours</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A1220">
  <meta name="description" content="Calendrier des entraînements : semaine visible, planification sur un an, créneaux 18h00 et 18h30, 5 lieux.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <header class="entete">
      <div>
        <h1>Calendrier des entraînements</h1>
        <p id="periode">Chargement…</p>
      </div>
      <nav class="navigation" aria-label="Navigation par semaine">
        <button type="button" id="precedent" aria-label="7 jours précédents">‹ Précédent</button>
        <button type="button" id="aujourdhui">Aujourd’hui</button>
        <button type="button" id="suivant" aria-label="7 jours suivants">Suivant ›</button>
      </nav>
    </header>

    <p class="message erreur" id="alerte" role="alert" hidden></p>

    <div class="cadre">
      <table id="calendrier">
        <caption class="etat" id="etat">Chargement du calendrier…</caption>
        <thead><tr id="entete-jours"></tr></thead>
        <tbody id="corps"></tbody>
      </table>
    </div>

    <ul class="legende" id="legende" aria-label="Lieux possibles"></ul>

    <!-- Repliée par défaut : les utilisateurs ne voient que leur semaine. -->
    <details class="annee" id="panneau-annee">
      <summary>Vue année — planification sur 12 mois</summary>
      <div id="annee-contenu" class="annee-contenu">
        <p class="etat">Chargement…</p>
      </div>
    </details>
  </main>

  <dialog id="dialogue">
    <form method="dialog" id="formulaire">
      <div>
        <h2 id="dialogue-titre">Nouvelle séance</h2>
        <p class="contexte" id="dialogue-contexte"></p>
      </div>

      <p class="message erreur" id="dialogue-alerte" role="alert" hidden></p>

      <label>Statut
        <select id="champ-statut" name="statut" required></select>
      </label>

      <label>Lieu
        <select id="champ-lieu" name="locationId" required></select>
      </label>

      <label>Heure
        <select id="champ-heure" name="time" required></select>
      </label>

      <label>Intitulé
        <input id="champ-titre" name="title" type="text" maxlength="120" placeholder="Entraînement">
      </label>

      <label>Encadrant
        <input id="champ-coach" name="coach" type="text" maxlength="80" placeholder="Optionnel">
      </label>

      <label>Places
        <input id="champ-capacite" name="capacity" type="number" min="1" max="200" value="20" required>
      </label>

      <label>Notes
        <textarea id="champ-notes" name="notes" maxlength="2000" placeholder="Optionnel"></textarea>
      </label>

      <section class="vocal" aria-labelledby="vocal-titre">
        <h3 id="vocal-titre">Notes vocales</h3>
        <div class="vocal-barre">
          <button type="button" id="enregistrer-voix">● Enregistrer</button>
          <span class="vocal-etat" id="vocal-etat">Prêt</span>
        </div>
        <p class="vocal-aide" id="vocal-aide" hidden></p>
        <ul class="vocal-liste" id="vocal-liste"></ul>
      </section>

      <div class="actions">
        <button type="button" class="danger a-gauche" id="archiver" hidden>Archiver</button>
        <button type="button" id="annuler">Annuler</button>
        <button type="submit" class="principal" id="enregistrer">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
