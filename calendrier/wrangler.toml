# Déploiement du calendrier sur Cloudflare Workers.
#
# L'espace KV ci-dessous est déjà celui du calendrier : ce fichier est prêt,
# il n'y a rien à y changer, même après une mise à jour du dossier.
#
#   npm run deploy

name = "calendrier-entrainements"
main = "cloudflare/worker.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# La page (HTML, CSS, JS) est servie directement par Cloudflare.
[assets]
directory = "./public"
binding = "ASSETS"

# Les séances et les notes vocales vivent ici.
[[kv_namespaces]]
binding = "CALENDRIER"
id = "fba4f8f3a8c440c895e548b4e063dcc7"
